name: Bug report
description: Something on the site is broken
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Describe what you did and what went wrong.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
